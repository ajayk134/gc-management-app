name: Keep Render Backend Alive

on:
  schedule:
    - cron: "2-59/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: keep-render-alive
  cancel-in-progress: false

jobs:
  health-check:
    name: Ping Render health endpoint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check Render health
        env:
          RENDER_HEALTH_URL: ${{ vars.RENDER_HEALTH_URL }}
        run: |
          set -uo pipefail

          if [ -z "${RENDER_HEALTH_URL:-}" ]; then
            echo "::error title=Missing configuration::Repository variable RENDER_HEALTH_URL is not set."
            exit 1
          fi

          echo "Health endpoint: $RENDER_HEALTH_URL"
          attempts=3
          attempt=1

          while [ "$attempt" -le "$attempts" ]; do
            echo "Attempt $attempt/$attempts..."
            http_code=$(curl --silent --show-error --location --max-time 60 \
              --output /tmp/render-health.json \
              --write-out '%{http_code}' \
              "$RENDER_HEALTH_URL" 2>/tmp/render-health.err)
            curl_status=$?

            if [ "$curl_status" -eq 0 ] && [ "$http_code" = "200" ] && jq -e '.status == "ok"' /tmp/render-health.json >/dev/null 2>&1; then
              echo "Health check succeeded with HTTP 200 and status=ok."
              cat /tmp/render-health.json
              exit 0
            fi

            echo "::warning title=Health check attempt failed::Attempt $attempt/$attempts returned HTTP ${http_code:-none} (curl exit ${curl_status})."
            if [ -s /tmp/render-health.err ]; then
              sed 's/^/curl: /' /tmp/render-health.err
            fi
            if [ -s /tmp/render-health.json ]; then
              echo "Response body:"
              cat /tmp/render-health.json
              echo
            fi

            attempt=$((attempt + 1))
            if [ "$attempt" -le "$attempts" ]; then
              sleep 10
            fi
          done

          echo "::error title=Render health check failed::The endpoint did not return a healthy response after $attempts attempts: $RENDER_HEALTH_URL"
          {
            echo "### Render keep-alive failed"
            echo ""
            echo "Endpoint: \`$RENDER_HEALTH_URL\`"
            echo ""
            echo "The health endpoint did not return HTTP 200 with \`{\"status\":\"ok\"}\` after $attempts attempts."
          } >> "$GITHUB_STEP_SUMMARY"
          exit 1
